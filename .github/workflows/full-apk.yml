# Full APK: builds the whole Linux payload (Debian rootfs arm64/amd64, patched glibc,
# FEX with thunks, Mesa Turnip; PLAN.md "Pipeline de build") and then the app, on a
# GitHub runner. Same scripts as on the developer PC; takes 1-2 hours.
# Result: artifact "fexdroid-full-apk" (legacy flavor = the one that runs the payload).
name: Full APK (with Linux payload)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'tools/**'
      - 'tests/**'
      - 'app/**'
      - '.github/workflows/full-apk.yml'

permissions:
  contents: write

concurrency:
  group: full-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
      FEXDROID_SDK: /usr/local/lib/android/sdk
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build patchelf squashfs-tools erofs-utils ccache zstd \
            libarchive-tools bison flex file gcc-multilib glslang-tools >/dev/null
          sudo pip3 install --break-system-packages -q 'meson>=1.4' mako pyyaml packaging
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22 >/dev/null
          sudo apt-get install -y -qq libclang-cpp22-dev libclang-22-dev llvm-22-dev lld-22 >/dev/null
          for f in /usr/lib/llvm-22/bin/*; do sudo ln -sf "$f" /usr/local/bin/$(basename "$f"); done
          clang --version | head -1; meson --version

      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" --install "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null
          "$SDKM" --install "platforms;android-37" >/dev/null || true

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # Each stage's output is cached under a key made of the inputs that shape it, so a
      # run that only changes the app (or one stage) skips the unchanged stages.
      - name: Cache rootfs + sysroots
        id: c-rootfs
        uses: actions/cache@v4
        with:
          path: build/rootfs
          key: rootfs-v1-${{ hashFiles('scripts/build-rootfs.sh', 'scripts/build-x86-sysroot.sh', 'scripts/config.sh') }}
      - name: Cache glibc
        id: c-glibc
        uses: actions/cache@v4
        with:
          path: build/glibc/install
          key: glibc-v1-${{ hashFiles('scripts/build-glibc.sh', 'scripts/config.sh', 'patches/glibc/**', 'scripts/lib/make-glibc*', 'scripts/lib/gen-android-seccomp.py', 'third_party/aosp-bionic-seccomp/**', 'tools/fxshmd/*.h') }}
      - name: Cache FEX
        id: c-fex
        uses: actions/cache@v4
        with:
          path: build/fex/install
          key: fex-v1-${{ hashFiles('scripts/build-fex.sh', 'scripts/config.sh', 'patches/fex/**', 'scripts/cmake/**', 'scripts/lib/make-fex*', 'scripts/lib/gen-android-seccomp.py', 'third_party/aosp-bionic-seccomp/**', 'scripts/build-rootfs.sh', 'scripts/build-x86-sysroot.sh') }}
      - name: Cache Mesa
        id: c-mesa
        uses: actions/cache@v4
        with:
          path: build/mesa/install
          key: mesa-v1-${{ hashFiles('scripts/build-mesa.sh', 'scripts/config.sh', 'patches/mesa/**', 'scripts/build-rootfs.sh') }}

      - name: Build rootfs + sysroots
        if: steps.c-rootfs.outputs.cache-hit != 'true'
        run: scripts/build-rootfs.sh && scripts/build-x86-sysroot.sh
      - name: Build glibc
        if: steps.c-glibc.outputs.cache-hit != 'true'
        run: scripts/build-glibc.sh 2>&1 | tail -40
      - name: Build FEX
        if: steps.c-fex.outputs.cache-hit != 'true'
        run: scripts/build-fex.sh 2>&1 | tail -40
      - name: Build Mesa
        if: steps.c-mesa.outputs.cache-hit != 'true'
        run: scripts/build-mesa.sh 2>&1 | tail -60
      - name: Assemble payload
        run: |
          scripts/build-payload.sh 2>&1 | tail -40
          ls -la build/payload/assets build/payload/jniLibs/arm64-v8a

      - name: Payload self-tests (qemu)
        continue-on-error: true
        run: |
          FXD_ROOT=/data/data/ro.cobrabm.fexdroid/files/rootfs
          scripts/test-payload-qemu.sh "$FXD_ROOT/opt/fexdroid-tests/seccomp-wrap" || true
          scripts/test-payload-qemu.sh "$FXD_ROOT/opt/fexdroid-tests/shmtest all" || true

      # The same signing key on every run, so a new APK installs over the previous one (another
      # key forces an uninstall, which wipes the installed Linux environment and the games).
      # Repository secrets; without them (a fork) the build uses the runner's debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FEXDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FEXDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fexdroid.jks"
            echo "FEXDROID_KEYSTORE=$RUNNER_TEMP/fexdroid.jks" >> "$GITHUB_ENV"
            echo "FEXDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signing with the project's key"
          else
            echo "::warning::no signing key in the repository secrets: this APK will not install over a published one"
          fi

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleLegacyDebug

      - name: Signing certificate
        run: |
          APKSIGNER=$(ls "$FEXDROID_SDK"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/legacy/debug/app-legacy-debug.apk | grep -E "SHA-256|DN:"

      - uses: actions/upload-artifact@v4
        with:
          name: fexdroid-full-apk
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish APK (release "apk-latest", downloadable from the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/legacy/debug/app-legacy-debug.apk fexdroid-legacy.apk
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --target "$GITHUB_SHA" --prerelease --title "fexdroid APK (latest build)" \
              --notes "Full APK with the Linux payload, built by the Full APK workflow. Install fexdroid-legacy.apk."
          gh release upload apk-latest --clobber fexdroid-legacy.apk
          # For the in-app updater (Updater.kt): uploaded after the APK it describes.
          printf '{"sha":"%s","built":"%s","size":%s,"sha256":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(stat -c %s fexdroid-legacy.apk)" "$(sha256sum fexdroid-legacy.apk | cut -d' ' -f1)" > fexdroid-legacy.json
          cat fexdroid-legacy.json
          gh release upload apk-latest --clobber fexdroid-legacy.json
