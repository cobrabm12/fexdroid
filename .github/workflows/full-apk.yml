# Full APK: builds the whole Linux payload (Debian rootfs arm64/amd64, patched glibc,
# FEX with thunks, Mesa Turnip; PLAN.md "Pipeline de build") and then the app, on a
# GitHub runner. Same scripts as on the developer PC; takes 1-2 hours.
# Result: artifact "fexdroid-full-apk" (legacy flavor = the one that runs the payload).
name: Full APK (with Linux payload)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'tools/**'
      - 'tests/**'
      - 'app/**'
      - '.github/workflows/full-apk.yml'

concurrency:
  group: full-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
      FEXDROID_SDK: /usr/local/lib/android/sdk
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build patchelf squashfs-tools erofs-utils ccache zstd \
            libarchive-tools bison flex file gcc-multilib >/dev/null
          sudo pip3 install --break-system-packages -q 'meson>=1.4' mako pyyaml packaging
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22 >/dev/null
          sudo apt-get install -y -qq libclang-cpp22-dev libclang-22-dev llvm-22-dev lld-22 >/dev/null
          for f in /usr/lib/llvm-22/bin/*; do sudo ln -sf "$f" /usr/local/bin/$(basename "$f"); done
          clang --version | head -1; meson --version

      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" --install "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null
          "$SDKM" --install "platforms;android-37" >/dev/null || true

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build payload
        run: |
          set -o pipefail
          for s in build-rootfs build-x86-sysroot build-glibc build-fex build-mesa build-payload; do
            echo "::group::$s"
            start=$(date +%s)
            scripts/$s.sh 2>&1 | tail -60
            echo "$s: $(( $(date +%s) - start )) s"
            echo "::endgroup::"
          done
          ls -la build/payload/assets build/payload/jniLibs/arm64-v8a

      - name: Payload self-tests (qemu)
        continue-on-error: true
        run: |
          FXD_ROOT=/data/data/ro.cobrabm.fexdroid/files/rootfs
          scripts/test-payload-qemu.sh "$FXD_ROOT/opt/fexdroid-tests/seccomp-wrap" || true
          scripts/test-payload-qemu.sh "$FXD_ROOT/opt/fexdroid-tests/shmtest all" || true

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleLegacyDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fexdroid-full-apk
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
          compression-level: 0
